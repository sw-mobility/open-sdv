            label: 개발 문서 주소
            type: string
            pattern: ^(?:https?://.+)?$
            description: 설치·사용 가이드 주소입니다. 별도 문서가 없으면 비워두세요.
          - name: homepage
            label: 프로젝트 홈페이지 주소
            type: string
            pattern: ^(?:https?://.+)?$
            description: 기관 홈페이지가 아닌 프로젝트 전용 주소입니다. 없으면 비워두세요.
          - name: license
            label: 05 · 라이선스
            type: string
            description: "예: Apache-2.0, MIT, EPL-2.0. 확인되지 않았으면 비워두세요."
          - name: categories
            label: 06 · 기술 분류
            type: string
            list: true
            description: "항목 추가로 하나씩 입력하세요. 예: 플랫폼, 클라우드, AI / ML. 목록 카드와 분류 필터에 사용합니다."
          - name: sdv_layers
            label: SDV 적용 계층
            type: select
            options:
              values:
                - name: vehicle
                  label: 차량
                - name: edge
                  label: 엣지
                - name: cloud
                  label: 클라우드
                - name: tooling
                  label: 개발 도구
                - name: data
                  label: 데이터
                - name: safety
                  label: 안전
              multiple: true
          - name: technologies
            label: 사용 기술
            type: string
            list: true
            description: "언어·프레임워크·프로토콜을 하나씩 입력하세요. 예: Python, Yocto, ROS 2"
          - name: integrates_with
            label: 연관 프로젝트
            type: select
            options:
              multiple: true
              values:
                - name: edge-vision
                  label: Edge_Vision
                - name: omp-cloudie
                  label: OMP_Cloudie
                - name: omp-phm
                  label: OMP_PHM
                - name: sdv-agent
                  label: SDV_agent
                - name: sdv-aifw
                  label: SDV_AIFW
                - name: tango-sdv
                  label: TANGO-SDV
            description: 연동하거나 함께 활용하는 프로젝트를 선택하세요. 없으면 선택하지 않아도 됩니다.
          - name: maintainers
            label: 07 · 프로젝트 담당자
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{name} · {role}"
            description: 참여기관과 문의·기여 탭에 표시됩니다. 공개 가능한 이름·팀명을 입력하세요. GitHub 계정은 선택사항입니다.
            fields:
              - name: name
                label: 이름 또는 팀명
                type: string
                required: true
              - name: role
                label: 역할
                type: string
                required: true
                description: "예: 프로젝트 담당, 개발, Maintainer"
              - name: github
                label: GitHub 계정명
                type: string
                pattern:
                  regex: ^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?)?$
                  message: URL이 아닌 GitHub 계정명만 입력하세요.
                description: https://github.com/ 부분을 제외한 계정명입니다. 없으면 비워두세요.
          - name: last_reviewed
            label: 08 · 정보 확인일
            type: date
            required: true
            options:
              time: false
              format: yyyy-MM-dd
            description: 입력한 정보를 마지막으로 확인한 날짜입니다. 수정 시 오늘 날짜로 갱신하세요.
          - name: featured
            label: 대표 프로젝트 표시
            type: boolean
            hidden: true
            readonly: true
