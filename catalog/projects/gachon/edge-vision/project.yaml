body: |
  # Edge_Vision

  ## 프로젝트 소개

  Jetson 계열 엣지 장치에서 경량 AI 모델을 실행·최적화하는 프로젝트입니다. NAS, Pruning, Quantization 및 YOLO 계열 모델의 추론 방법을 다룹니다.

  ## 설치 및 사용

  공식 README에서 로컬 실행 환경과 YOLO 계열 추론 예제를 확인할 수 있습니다. 일부 Jetson 보드별 사용법은 현재 TBD로 표시되어 있습니다.

  [공식 저장소에서 README 확인](https://github.com/sw-mobility/Edge_Vision#readme)

  ## 참여 및 기여

  기여 절차와 문의 경로는 공식 저장소의 안내를 확인하세요. 담당기관은 이 문서에 설치 방법, 사용 예제, 지원 환경과 기여 안내를 추가할 수 있습니다.

  ## 정보 출처

  담당기관은 공동 프로젝트 목록을 기준으로 연결했습니다. 소개는 공식 저장소의 공개 README를 바탕으로 요약했습니다.
