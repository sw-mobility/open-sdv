body: |
  # SDV_agent

  ## 프로젝트 소개

  분석용 이미지 데이터 업로드와 S3 디렉터리 동기화 기능을 제공합니다. 동기화 주기와 파일 갱신에 따른 콜백을 설정할 수 있습니다.

  ## 설치 및 사용

  공식 README에 S3 설정, 이미지 업로드 실행 및 S3DirSync API 예제가 있습니다. 실행에 필요한 인증정보는 각 기관의 환경에서 관리합니다.

  [공식 저장소에서 README 확인](https://github.com/sw-mobility/SDV_agent#readme)

  ## 참여 및 기여

  기여 절차와 문의 경로는 공식 저장소의 안내를 확인하세요. 담당기관은 이 문서에 설치 방법, 사용 예제, 지원 환경과 기여 안내를 추가할 수 있습니다.

  ## 정보 출처

  담당기관은 공동 프로젝트 목록을 기준으로 연결했습니다. 소개는 공식 저장소의 공개 README를 바탕으로 요약했습니다.
