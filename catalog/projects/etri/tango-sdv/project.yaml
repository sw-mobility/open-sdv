  # TANGO-SDV

  ## 프로젝트 소개

  대상 데이터와 장치 특성을 고려해 신경망을 생성하고 배포하는 TANGO 프레임워크입니다. 노코드 모델 개발, 데이터 라벨링, 모델 시각화 및 자동 신경망 생성 기능을 소개합니다.

  ## 설치 및 사용

  공식 README와 docs 디렉터리에서 구성 요소, 실행 환경과 개발 문서를 확인하세요. 컴포넌트별 라이선스와 실제 적용 조건은 저장소의 LICENSE 파일을 확인해야 합니다.

  [공식 저장소에서 README 확인](https://github.com/sw-mobility/TANGO-SDV#readme)

  ## 참여 및 기여

  기여 절차와 문의 경로는 공식 저장소의 안내를 확인하세요. 담당기관은 이 문서에 설치 방법, 사용 예제, 지원 환경과 기여 안내를 추가할 수 있습니다.

  ## 정보 출처

  담당기관은 공동 프로젝트 목록을 기준으로 연결했습니다. 소개는 공식 저장소의 공개 README를 바탕으로 요약했습니다.
