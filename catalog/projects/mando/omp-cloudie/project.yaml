  # OMP_Cloudie

  ## 프로젝트 소개

  차량 데이터의 전처리·클라우드 전송, 컨테이너 관리, CI/CD 및 차량-클라우드 MLOps를 다룹니다.

  ## 설치 및 사용

  공식 README의 사용법과 기여 안내는 현재 TBD로 표시되어 있습니다. 구체적인 설치·운영 방법은 담당기관이 보완할 예정입니다.

  [공식 저장소에서 README 확인](https://github.com/sw-mobility/OMP_Cloudie#readme)

  ## 참여 및 기여

  기여 절차와 문의 경로는 공식 저장소의 안내를 확인하세요. 담당기관은 이 문서에 설치 방법, 사용 예제, 지원 환경과 기여 안내를 추가할 수 있습니다.

  ## 정보 출처

  담당기관은 공동 프로젝트 목록을 기준으로 연결했습니다. 소개는 공식 저장소의 공개 README를 바탕으로 요약했습니다.
